<style>
:root {
  /* Sindoor maroon and temple gold, with haldi and marigold as festival accents */
  --sindoor: #7d1427;
  --sindoor-deep: #4a0a16;
  --gold: #c9a14a;
  --gold-soft: #ecd394;
  --gold-ink: #94701f;
  --ivory: #fcf6ea;
  --ink: #3b1a12;
  --marigold: #ea8a1e;
  --haldi: #f3c533;
  --f-display: 'Rozha One', 'Tiro Devanagari Hindi', Georgia, serif;
  --f-body: 'Mukta', 'Segoe UI', system-ui, sans-serif;
  /* Layout: one 560px phone-first column; maroon patterned panels alternate with gold-framed ivory "card paper" panels */
  color-scheme: light;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background-color: var(--sindoor-deep);
  background-image: var(--pattern);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 17px;
  line-height: 1.6;
}
.wrap { max-width: 560px; margin: 0 auto; background: var(--sindoor); box-shadow: 0 0 60px rgba(0,0,0,.45); overflow: hidden; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--haldi); outline-offset: 3px; border-radius: 4px; }

.draft {
  background: var(--haldi); color: #4a2a00; text-align: center;
  font-size: 13px; font-weight: 600; padding: 6px 16px; letter-spacing: .02em;
}

/* Marigold toran garland */
.toran {
  height: 30px;
  background:
    radial-gradient(circle at 50% 45%, var(--marigold) 0 8px, transparent 9px) 0 0 / 28px 30px repeat-x,
    radial-gradient(circle at 50% 45%, var(--haldi) 0 8px, transparent 9px) 14px 0 / 28px 30px repeat-x,
    linear-gradient(var(--sindoor-deep), var(--sindoor-deep)) 0 12px / 100% 2px no-repeat;
}
.toran.flip { transform: scaleY(-1); }

.eyebrow {
  font: 600 12px/1.3 var(--f-body);
  letter-spacing: .28em; text-transform: uppercase;
  color: var(--gold-ink); margin: 0;
}
.on-dark .eyebrow { color: var(--gold-soft); opacity: .85; }
h2 {
  font-family: var(--f-display); font-weight: 400;
  font-size: clamp(30px, 8vw, 40px); line-height: 1.1;
  color: var(--sindoor); margin: .25em 0 .4em; text-wrap: balance;
}
.on-dark h2 { color: var(--gold-soft); }
.orn { display: flex; justify-content: center; gap: 10px; margin: 18px 0; }
.orn i { width: 7px; height: 7px; background: var(--gold); transform: rotate(45deg); display: block; }
.orn i:nth-child(2) { width: 10px; height: 10px; }

/* Panels */
.panel { padding: 52px 28px; text-align: center; position: relative; }
.paper { background: var(--ivory); }
.paper::before, .paper::after { content: ""; position: absolute; pointer-events: none; border: 1px solid var(--gold); }
.paper::before { inset: 12px; }
.paper::after { inset: 17px; opacity: .45; }
.on-dark { background-color: var(--sindoor); background-image: var(--pattern); color: var(--gold-soft); }

/* Hero + envelope */
.gate {
  position: fixed; inset: 0; z-index: 60; overflow: hidden;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 16px; text-align: center; touch-action: none;
  background-color: var(--sindoor); background-image: var(--pattern), radial-gradient(circle at 50% 45%, #93203a, var(--sindoor-deep) 75%);
  transition: opacity .9s ease, visibility .9s ease;
}
.gate.gone { opacity: 0; visibility: hidden; pointer-events: none; }
.gate .toran { position: absolute; top: 0; left: 0; right: 0; }
.gate .ganesh { position: absolute; top: max(48px, env(safe-area-inset-top)); left: 0; right: 0; margin: 0; font-family: var(--f-display); font-size: 20px; color: var(--gold-soft); }
.gate .env { width: min(88vw, 380px); margin-top: 60px; }
html.locked, html.locked body { overflow: hidden; height: 100%; }
.env { position: relative; width: min(100%, 380px); aspect-ratio: 10 / 7; margin: 0 auto; perspective: 1200px; }
.env-back { position: absolute; inset: 0; border-radius: 6px; background: linear-gradient(#9a1f33, #5e0c1c); box-shadow: 0 22px 44px rgba(0,0,0,.4); }
.mini {
  position: absolute; left: 7%; right: 7%; top: 6%; height: 88%; z-index: 2;
  background: var(--ivory); color: var(--sindoor); border-radius: 4px;
  outline: 1px solid var(--gold); outline-offset: -8px;
  display: flex; flex-direction: column; align-items: center; padding-top: 7%;
  transition: transform 1.1s cubic-bezier(.2,.8,.2,1) .35s;
}
.mini .shubh { font-family: var(--f-display); font-size: 15px; color: var(--gold-ink); }
.mini .names { font-family: var(--f-display); font-size: clamp(24px, 7vw, 32px); line-height: 1.1; margin: 4px 0 2px; }
.mini .sub { font-size: 12px; letter-spacing: .22em; text-transform: uppercase; color: var(--ink); }
.env.open .mini { transform: translateY(-60%); }
.env-front {
  position: absolute; inset: 0; z-index: 3; border-radius: 6px;
  background: linear-gradient(165deg, #93203a, #640e20);
  clip-path: polygon(0 0, 50% 50%, 100% 0, 100% 100%, 0 100%);
  display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
  padding-bottom: 5%; color: var(--gold-soft);
}
.env-front .to { font-size: 11px; letter-spacing: .26em; text-transform: uppercase; opacity: .8; }
.env-front .who { font-family: var(--f-display); font-size: clamp(22px, 6.4vw, 28px); color: var(--gold-soft); line-height: 1.2; }
.env-front .when { font-size: 13px; letter-spacing: .3em; font-variant-numeric: tabular-nums; }
.fold { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.env-flap {
  position: absolute; left: 0; right: 0; top: 0; height: 50%; z-index: 4;
  background: linear-gradient(#a8283f, #7d1427);
  clip-path: polygon(0 0, 100% 0, 50% 100%);
  transform-origin: top center; transition: transform .8s ease;
}
.env.open .env-flap { transform: rotateX(180deg); }
.env.flap-back .env-flap { z-index: 1; }
.seal {
  position: absolute; left: 50%; top: 50%; z-index: 5; transform: translate(-50%, -50%);
  width: 68px; height: 68px; border-radius: 50%; border: 0; cursor: pointer;
  background: radial-gradient(circle at 35% 30%, #f8e2a2, #c9a14a 55%, #82621d);
  box-shadow: 0 6px 16px rgba(0,0,0,.45), inset 0 0 0 4px rgba(255,255,255,.18), inset 0 -5px 9px rgba(0,0,0,.25);
  font: 21px/1 var(--f-display); color: #5f420f;
  transition: opacity .5s, transform .5s;
}
.seal::after {
  content: ""; position: absolute; inset: -11px; border-radius: 50%;
  border: 1.5px dashed rgba(236,211,148,.75); animation: spin 14s linear infinite;
}
.env.open .seal { opacity: 0; transform: translate(-50%, -50%) scale(1.5); pointer-events: none; }
.hint { margin: 30px 0 0; font-size: 12px; letter-spacing: .26em; text-transform: uppercase; color: var(--gold-soft); }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes breathe { 50% { transform: translate(-50%, -50%) scale(1.06); } }
.env:not(.open) .seal { animation: breathe 2.6s ease-in-out infinite; }

/* Letter */
.shloka { font-family: var(--f-display); color: var(--sindoor); font-size: 17px; line-height: 1.7; margin: 10px 0 6px; }
.blessing { font-style: italic; color: var(--gold-ink); margin: 0 0 22px; }
.couple { font-family: var(--f-display); color: var(--sindoor); font-size: clamp(46px, 13vw, 64px); line-height: 1; margin: 10px 0; }
.couple .amp { display: block; font-size: .45em; color: var(--gold); margin: 6px 0; }
.invite-line { letter-spacing: .2em; text-transform: uppercase; font-size: 13px; margin: 14px 0 0; }
.note { max-width: 34ch; margin: 0 auto; text-wrap: pretty; }
.sign { font-family: var(--f-display); color: var(--sindoor); font-size: 22px; margin-top: 18px; }
.shloka.small { font-size: 15px; margin: 0 0 22px; }
.couple-art { width: min(270px, 78%); margin: 18px auto 22px; }
.couple-art svg { display: block; width: 100%; height: auto; overflow: visible; filter: drop-shadow(0 10px 18px rgba(74,10,22,.18)); }
.couple-art.small { width: 150px; margin: 22px auto 6px; }
.ppl { font-family: var(--f-display); font-weight: 600; font-size: 21px; line-height: 1.3; color: var(--sindoor); margin: 14px 0 0; text-wrap: balance; }
.ppl .lbl { display: block; font: 600 11px/1.4 var(--f-body); letter-spacing: .24em; text-transform: uppercase; color: var(--gold-ink); margin-bottom: 4px; }
.ppl .lbl.after { margin: 4px 0 0; }
.mini-rule { display: block; width: 44px; height: 1px; background: var(--gold); margin: 16px auto 2px; }
#invite .note { margin-top: 12px; }
.bless { margin: 12px 0 2px; font-size: 12px; letter-spacing: .2em; text-transform: uppercase; color: var(--gold-ink); }
.bless b { display: block; margin-top: 4px; font: 400 21px/1.3 var(--f-display); letter-spacing: 0; text-transform: none; color: var(--sindoor); }
.invite-date { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 6px 0 0; color: var(--sindoor); }
.invite-date span { font-size: 12px; font-weight: 600; letter-spacing: .24em; text-transform: uppercase; padding: 6px 0; border-top: 1px solid var(--gold); border-bottom: 1px solid var(--gold); min-width: 92px; }
.invite-date b { font: 400 46px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.host { font-family: var(--f-display); color: var(--sindoor); font-size: 26px; line-height: 1.2; margin: 10px 0 6px; }
#invite .couple { font-size: clamp(44px, 12vw, 58px); margin: 18px 0 2px; }
#invite .couple.with { font-size: 22px; color: var(--gold-ink); margin: 14px 0 0; }
.parents { margin: 0; font-size: 15px; color: #6a4a3e; text-wrap: balance; }
.special { margin: 22px 0 0; font-size: 13px; letter-spacing: .18em; text-transform: uppercase; color: var(--gold-ink); }
.special b { display: block; font: 400 24px/1.3 var(--f-display); letter-spacing: 0; text-transform: none; color: var(--sindoor); margin-top: 4px; }

/* Calendar */
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; max-width: 330px; margin: 14px auto 0; font-variant-numeric: tabular-nums; }
.cal .dow { font-size: 11px; font-weight: 700; letter-spacing: .1em; color: var(--gold-ink); }
.cal .d { aspect-ratio: 1; display: grid; place-items: center; font-size: 15px; border-radius: 50%; position: relative; }
.cal .d.ev::after { content: ""; position: absolute; bottom: 3px; width: 5px; height: 5px; border-radius: 50%; background: var(--marigold); }
.cal .d.main { background: var(--sindoor); color: var(--gold-soft); font-weight: 700; box-shadow: 0 0 0 3px var(--ivory), 0 0 0 4.5px var(--gold); }
.legend { list-style: none; padding: 0; margin: 20px 0 0; display: grid; gap: 4px; font-size: 15px; }
.legend b { color: var(--sindoor); font-weight: 600; }

/* Countdown */
.count { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 20px 0 14px; }
.count div { border: 1px solid rgba(236,211,148,.45); border-radius: 10px; padding: 12px 4px 8px; background: rgba(0,0,0,.14); }
.count b { display: block; font-family: var(--f-display); font-weight: 400; font-size: clamp(28px, 8vw, 38px); line-height: 1; color: var(--gold-soft); font-variant-numeric: tabular-nums; }
.count span { font-size: 10px; letter-spacing: .24em; text-transform: uppercase; opacity: .8; }
.btn {
  display: inline-flex; align-items: center; gap: 8px; text-decoration: none;
  font: 600 13px/1 var(--f-body); letter-spacing: .14em; text-transform: uppercase;
  padding: 14px 20px; border-radius: 999px; border: 1px solid var(--gold);
  background: linear-gradient(#e6c879, #c9a14a); color: #4a2a05; cursor: pointer;
}
.btn.ghost { background: transparent; color: var(--sindoor); }
.on-dark .btn.ghost { color: var(--gold-soft); }

/* Events carousel */
.track {
  display: flex; gap: 14px; overflow-x: auto; scroll-snap-type: x mandatory;
  padding: 8px 6% 18px; margin: 10px -28px 0; scrollbar-width: none; text-align: left;
}
.track::-webkit-scrollbar { display: none; }
.ev-card {
  flex: 0 0 88%; scroll-snap-align: center; border-radius: 16px; overflow: hidden;
  background: #fff; box-shadow: 0 10px 28px rgba(74,10,22,.16); border: 1px solid rgba(201,161,74,.5);
  display: flex; flex-direction: column;
}
.ev-head { padding: 22px 22px 18px; background-image: var(--pattern), linear-gradient(150deg, var(--c1), var(--c2)); color: var(--c3); position: relative; }
.ev-num { font-size: 11px; letter-spacing: .24em; opacity: .85; font-variant-numeric: tabular-nums; }
.ev-hi { font-family: var(--f-display); font-size: 40px; line-height: 1.15; display: block; margin-top: 6px; }
.ev-head h3 { margin: 0; font: 600 13px/1.2 var(--f-body); letter-spacing: .26em; text-transform: uppercase; }
.ev-tag { margin: 8px 0 0; font-style: italic; font-size: 15px; opacity: .92; }
.ev-body { padding: 18px 22px 22px; display: flex; flex-direction: column; gap: 14px; flex: 1; }
.ev-meta { display: grid; gap: 10px; margin: 0; }
.ev-meta div { display: grid; grid-template-columns: 86px 1fr; gap: 10px; align-items: baseline; }
.ev-meta dt { font-size: 11px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; color: var(--gold-ink); }
.ev-meta dd { margin: 0; font-size: 15.5px; line-height: 1.4; }
.sw { display: inline-flex; gap: 3px; margin-right: 6px; vertical-align: -1px; }
.sw i { width: 13px; height: 13px; border-radius: 50%; border: 1px solid rgba(0,0,0,.15); display: block; }
.ev-about { margin: 0; font-size: 15.5px; color: #5a3a2e; }
.ev-link { margin-top: auto; align-self: flex-start; font-weight: 600; font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--sindoor); text-decoration: none; border-bottom: 1px solid var(--gold); padding-bottom: 2px; }
.ev-card { --c1: #9a1f33; --c2: #4a0a16; --c3: #ecd394; }
.ev-card[data-k="haldi"]     { --c1: #f6d24a; --c2: #e9a51c; --c3: #4d2600; }
.ev-card[data-k="sangeet"]   { --c1: #4a3584; --c2: #22184a; --c3: #ecd394; }
.ev-card[data-k="ghurchari"] { --c1: #e2702a; --c2: #9c3a10; --c3: #fff1d6; }
.ev-card[data-k="baraat"]    { --c1: #9a1f33; --c2: #4a0a16; --c3: #ecd394; }
.ev-card[data-k="dinner"]    { --c1: #2f5d50; --c2: #173a31; --c3: #ecd394; }
.car-nav { display: flex; align-items: center; justify-content: center; gap: 14px; }
.car-nav button.arrow { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--gold); background: transparent; color: var(--sindoor); font-size: 18px; cursor: pointer; }
.dots { display: flex; gap: 8px; }
.dots button { width: 8px; height: 8px; padding: 0; border-radius: 50%; border: 0; background: rgba(125,20,39,.25); cursor: pointer; transition: width .3s, background .3s; }
.dots button[aria-current="true"] { width: 22px; border-radius: 4px; background: var(--sindoor); }

/* Venues */
.venues { display: grid; gap: 16px; margin-top: 18px; text-align: left; }
.venue { background: var(--ivory); color: var(--ink); border-radius: 14px; padding: 22px; border: 1px solid var(--gold); }
.venue .tag { font-size: 11px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: var(--gold-ink); }
.venue h3 { font-family: var(--f-display); font-weight: 400; color: var(--sindoor); font-size: 26px; line-height: 1.15; margin: 6px 0 2px; }
.venue .area { margin: 0 0 12px; color: #6a4a3e; }
.venue ul { list-style: none; padding: 0; margin: 0 0 16px; display: grid; gap: 4px; font-size: 15px; }
.venue li { display: flex; justify-content: space-between; gap: 12px; border-bottom: 1px dashed rgba(201,161,74,.55); padding-bottom: 4px; }
.venue li span:last-child { font-variant-numeric: tabular-nums; color: #6a4a3e; white-space: nowrap; }

/* Families */
.families { display: grid; gap: 14px; margin-top: 18px; text-align: left; }
.fam { position: relative; background: #fff; border: 1px solid rgba(201,161,74,.55); border-left: 4px solid var(--gold); border-radius: 12px; padding: 18px 18px 16px; box-shadow: 0 6px 18px rgba(74,10,22,.07); }
.fam .side { margin: 0 0 2px; font-size: 11px; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; color: var(--gold-ink); }
.fam h3 { font-family: var(--f-display); font-weight: 400; color: var(--sindoor); font-size: 26px; line-height: 1.15; margin: 0 0 4px; }
.fam .who { margin: 0; font-size: 16px; color: var(--ink); }
.fam .addr { margin: 6px 0 0; display: flex; align-items: center; gap: 6px; font-size: 14.5px; color: #6a4a3e; }
.fam .addr svg { width: 15px; height: 15px; flex: none; color: var(--gold-ink); }
.calls { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.call { display: inline-flex; align-items: center; gap: 7px; text-decoration: none; font-variant-numeric: tabular-nums; font-size: 15px; font-weight: 600;
  padding: 8px 14px; border-radius: 999px; background: var(--sindoor); color: var(--gold-soft); }
.call svg { width: 14px; height: 14px; }
.rsvp { margin-top: 26px; }

/* Footer */
.foot { padding: 46px 24px 40px; text-align: center; }
.foot .with { font-style: italic; margin: 0; }
.foot .names { font-family: var(--f-display); font-size: clamp(38px, 11vw, 52px); line-height: 1.1; color: var(--gold-soft); margin: 6px 0; }
.foot .meta { letter-spacing: .26em; font-size: 12px; text-transform: uppercase; opacity: .85; margin: 0; }
.foot .tagline { margin-top: 14px; font-size: 15px; }

/* Music + petals */
.music {
  position: fixed; right: 16px; bottom: max(16px, env(safe-area-inset-bottom)); z-index: 50;
  width: 52px; height: 52px; border-radius: 50%; border: 1px solid var(--gold);
  background: var(--sindoor-deep); color: var(--gold-soft); cursor: pointer;
  display: grid; place-items: center; box-shadow: 0 6px 18px rgba(0,0,0,.35);
}
.bars { display: flex; gap: 3px; align-items: flex-end; height: 18px; }
.bars i { width: 3px; height: 6px; background: var(--gold-soft); border-radius: 2px; display: block; }
.music.playing .bars i { animation: eq 1s ease-in-out infinite; }
.music.playing .bars i:nth-child(2) { animation-delay: .2s; }
.music.playing .bars i:nth-child(3) { animation-delay: .4s; }
.music.playing .bars i:nth-child(4) { animation-delay: .1s; }
@keyframes eq { 0%,100% { height: 5px; } 50% { height: 18px; } }
.music:not(.playing)::after { content: ""; position: absolute; width: 30px; height: 1.5px; background: var(--gold-soft); transform: rotate(-45deg); }
#petals { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 70; }

/* ===== Animation layer ===== */
/* Gate ambience */
.gate { background-image: var(--pattern); background-color: var(--sindoor); }
.gate .vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(circle at 50% 50%, rgba(255,190,110,.18), rgba(30,0,8,.55) 78%); transition: opacity .6s; }
.gate .glow { position: absolute; width: 520px; height: 520px; left: 50%; top: 52%; transform: translate(-50%, -50%); border-radius: 50%; pointer-events: none;
  background: radial-gradient(circle, rgba(236,211,148,.28), transparent 62%); animation: glow 4s ease-in-out infinite; }
@keyframes glow { 50% { opacity: .55; transform: translate(-50%, -50%) scale(1.08); } }
.dust { position: absolute; bottom: -10px; width: 4px; height: 4px; border-radius: 50%; background: var(--gold-soft); box-shadow: 0 0 8px 2px rgba(236,211,148,.7); opacity: 0; pointer-events: none; animation: rise linear infinite; }
@keyframes rise { 0% { transform: translateY(0) translateX(0); opacity: 0; } 12% { opacity: .9; } 80% { opacity: .6; } 100% { transform: translateY(-105vh) translateX(var(--drift)); opacity: 0; } }
.gate .env { transition: transform .9s cubic-bezier(.2,.8,.2,1), opacity .5s; }
.env:not(.open) { animation: floaty 4.5s ease-in-out infinite; }
@keyframes floaty { 0%,100% { transform: translateY(0) rotate(-.6deg); } 50% { transform: translateY(-9px) rotate(.6deg); } }
.seal { overflow: visible; }
.seal::before { content: ""; position: absolute; inset: 0; border-radius: 50%; pointer-events: none;

const CONFIG = {

  },
  events: [
    { key: "haldi", hi: "हल्दी", name: "Haldi", tagline: "Turmeric, marigolds and laughter",
      date: "2026-12-10", time: "11:00", venue: "resort",

    { key: "sangeet", hi: "संगीत संध्या", name: "Sangeet", tagline: "An evening of music and dance",

/* ---------- helpers ---------- */
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const DAYS = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function parts(d) { const [y, m, dd] = d.split("-").map(Number); return { y, m, d: dd, dow: new Date(Date.UTC(y, m - 1, dd)).getUTCDay() }; }
function longDate(d) { const p = parts(d); return `${DAYS[p.dow]}, ${p.d} ${MONTHS[p.m - 1]} ${p.y}`; }
function shortDate(d) { const p = parts(d); return `${p.d} ${MONTHS[p.m - 1].slice(0, 3)}`; }
function niceTime(t) { let [h, m] = t.split(":").map(Number); const ap = h >= 12 ? "PM" : "AM"; h = h % 12 || 12; return `${h}:${String(m).padStart(2, "0")} ${ap}`; }
function istDate(d, t) { return new Date(`${d}T${t}:00+05:30`); }
function mapsUrl(v) { return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(`${v.name}, ${v.area}`); }
function telHref(n) { return "tel:" + n.replace(/[^\d+]/g, ""); }
function gcalUrl() {
  const start = istDate(CONFIG.calendar.date, CONFIG.calendar.time);
  const end = new Date(start.getTime() + CONFIG.calendar.durationHours * 3600e3);
  const f = x => x.toISOString().replace(/[-:]/g, "").replace(/\.\d{3}/, "");
  const v = Object.values(CONFIG.venues)[0];
  const q = new URLSearchParams({
    action: "TEMPLATE",
    text: `${CONFIG.groom} & ${CONFIG.bride}'s Wedding`,
    dates: `${f(start)}/${f(end)}`,
    details: CONFIG.events.map(e => `${e.name}: ${niceTime(e.time)}`).join("\n"),
    location: v ? `${v.name}, ${v.area}` : CONFIG.city
  });
  return "https://calendar.google.com/calendar/render?" + q.toString();
}

/* ---------- background pattern ---------- */
const PATTERN_SVG = `<svg xmlns='http://www.w3.org/2000/svg' width='60' height='60' viewBox='0 0 60 60'><g fill='#f2b632' fill-opacity='.2'><path d='M30 14c4 5 4 9 0 13c-4-4-4-8 0-13z'/><path d='M30 46c4-5 4-9 0-13c-4 4-4 8 0 13z'/><path d='M14 30c5-4 9-4 13 0c-4 4-8 4-13 0z'/><path d='M46 30c-5-4-9-4-13 0c4 4 8 4 13 0z'/><circle cx='30' cy='30' r='2.5'/><circle cx='0' cy='0' r='4'/><circle cx='60' cy='0' r='4'/><circle cx='0' cy='60' r='4'/><circle cx='60' cy='60' r='4'/></g></svg>`;

document.documentElement.style.setProperty("--pattern", `url("data:image/svg+xml,${encodeURIComponent(PATTERN_SVG)}")`);


/* ---------- illustrated couple (drawn from the couple's photo) ---------- */
function garland(cx, y0, half, depth) {
  // rose varmala: red and pink roses with leaves and a strand of mogra, ending in a rose tassel
  const pts = [], n = 12;
  for (let i = 0; i <= n; i++) {
    const t = i / n;
    pts.push([(1-t)*(1-t)*(cx-half) + 2*(1-t)*t*cx + t*t*(cx+half), (1-t)*(1-t)*y0 + 2*(1-t)*t*(y0+depth*2) + t*t*y0]);
  }
  let leaves = "", jas = "", roses = "";
  pts.forEach(([x, y], i) => {
    const a = (i * 47) % 360;
    leaves += `<ellipse cx="${(x + 4).toFixed(1)}" cy="${(y + 2).toFixed(1)}" rx="4" ry="1.8" fill="#3f7a3a" transform="rotate(${a} ${x.toFixed(1)} ${y.toFixed(1)})"/>`;
    jas += `<circle cx="${x.toFixed(1)}" cy="${(y + 5.2).toFixed(1)}" r="1.5" fill="#fffdf4" stroke="#e8e0c8" stroke-width=".4"/>`;
    const pink = i % 3 === 1, base = pink ? "#d94f7e" : "#b3122f", mid = pink ? "#f07aa0" : "#d61f45", hi = pink ? "#fbb6cb" : "#ef5774";
    roses += `<g transform="translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${a})"><circle r="5.4" fill="${base}"/><circle r="4" cx=".4" fill="${mid}"/><path d="M-2.4 .8 a2.5 2.5 0 1 1 3 1.6 a1.5 1.5 0 1 1 -1.4 -2.1" fill="none" stroke="${base}" stroke-width="1"/><circle r="1.1" cx=".6" cy="-.6" fill="${hi}"/></g>`;
  });
  const by = y0 + depth + 7;
  const tassel = `<g transform="translate(${cx} ${by})">
      <path d="M-4 6 v12 M0 7 v15 M4 6 v12" stroke="#fffdf4" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="1 2.4"/>
      <circle cy="20" r="2" fill="#d9a441"/><circle cx="-4" cy="19" r="1.4" fill="#d9a441"/><circle cx="4" cy="19" r="1.4" fill="#d9a441"/>
      <ellipse cx="-7" cy="2" rx="5" ry="2.2" fill="#3f7a3a" transform="rotate(-30 -7 2)"/><ellipse cx="7" cy="2" rx="5" ry="2.2" fill="#3f7a3a" transform="rotate(30 7 2)"/>

    </g>`;
  return leaves + jas + roses + tassel;
}

/* ---------- build the page ---------- */
function render() {
  const C = CONFIG, w = parts(C.calendar.date);
  const evDays = new Set(C.events.map(e => e.date));
  const byDate = {};
  C.events.forEach(e => (byDate[e.date] ||= []).push(e.name.replace(/^The /, "")));
  const ornament = `<div class="orn reveal" aria-hidden="true"><i></i><i></i><i></i></div>`;

  // calendar grid (weeks start Monday)
  const first = new Date(Date.UTC(w.y, w.m - 1, 1)).getUTCDay();
  const daysIn = new Date(Date.UTC(w.y, w.m, 0)).getUTCDate();
  let cal = ["M","T","W","T","F","S","S"].map(d => `<div class="dow">${d}</div>`).join("");
  cal += `<div></div>`.repeat((first + 6) % 7);
  for (let d = 1; d <= daysIn; d++) {
    const iso = `${w.y}-${String(w.m).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
    const cls = iso === C.calendar.date ? "d main" : evDays.has(iso) ? "d ev" : "d";
    cal += `<div class="${cls}">${d}</div>`;
  }

  const cards = C.events.map((e, i) => {
    const v = C.venues[e.venue];
    return `<article class="ev-card" data-k="${esc(e.key)}" aria-label="${esc(e.name)}">
      <header class="ev-head">
        <span class="ev-num">${String(i + 1).padStart(2, "0")} / ${String(C.events.length).padStart(2, "0")}</span>
        <span class="ev-hi" lang="hi">${esc(e.hi)}</span>
        <h3>${esc(e.name)}</h3>
        <p class="ev-tag">${esc(e.tagline)}</p>
      </header>
      <div class="ev-body">
        <dl class="ev-meta">
          <div><dt>Date</dt><dd>${longDate(e.date)}</dd></div>
          <div><dt>Time</dt><dd>${niceTime(e.time)} onwards</dd></div>
          <div><dt>Venue</dt><dd>${esc(v.name)}, ${esc(v.area)}</dd></div>
          ${e.dress ? `<div><dt>Dress code</dt><dd><span class="sw" aria-hidden="true">${(e.swatches || []).map(c => `<i style="background:${esc(c)}"></i>`).join("")}</span>${esc(e.dress)}</dd></div>` : ""}
        </dl>
        <p class="ev-about">${esc(e.about)}</p>
        <a class="ev-link" href="${mapsUrl(v)}" target="_blank" rel="noopener">Get directions ↗</a>
      </div>
    </article>`;
  }).join("");

  const venues = Object.entries(C.venues).map(([id, v]) => {
    const list = C.events.filter(e => e.venue === id)
      .map(e => `<li><span>${esc(e.name)}</span><span>${shortDate(e.date)} · ${niceTime(e.time)}</span></li>`).join("");
    return `<div class="venue">
      <span class="tag">${esc(v.tag)}</span>
      <h3>${esc(v.name)}</h3>
      <p class="area">${esc(v.area)}</p>
      <ul>${list}</ul>
      <a class="btn" href="${mapsUrl(v)}" target="_blank" rel="noopener">Open in Google Maps ↗</a>
    </div>`;
  }).join("");

  const fams = C.families.map(f => `<div class="fam">
      <p class="side">${esc(f.side)}</p>
      <h3>${esc(f.name)}</h3>
      ${f.people ? `<p class="who">${esc(f.people)}</p>` : ""}
      ${f.address ? `<p class="addr"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z" fill="currentColor"/></svg>${esc(f.address)}</p>` : ""}

    </div>`).join("");

  const waNum = C.rsvpWhatsApp.replace(/\D/g, "");

  document.getElementById("app").innerHTML = `

    <section class="panel paper" id="invite">
      ${C.showShlokas ? `<p class="shloka reveal" lang="sa">${C.shloka}</p>` : ""}
      <div class="couple-art reveal pop" style="--d:.15s">${coupleSVG("a", `Illustration of ${esc(C.groom)} and ${esc(C.bride)} wearing marigold garlands`)}</div>

      ${C.blessingsFrom ? `<p class="ppl reveal"><span class="lbl">${esc(C.blessingsLabel)}</span>${esc(C.blessingsFrom)}</p><span class="mini-rule reveal" aria-hidden="true"></span>` : ""}

      <p class="names">${esc(C.groom)} &amp; ${esc(C.bride)}</p>
      <p class="meta">${w.d} ${MONTHS[w.m - 1]} ${w.y} · ${esc(C.city)}</p>
      ${C.hashtag ? `<p class="tagline">Share your photos with ${esc(C.hashtag)}</p>` : ""}
    </footer>
    <div class="toran flip" aria-hidden="true"></div>
  `;
}
render();

/* ---------- countdown ---------- */
const target = istDate(CONFIG.countdownTo.date, CONFIG.countdownTo.time).getTime();
function tick() {
  let s = Math.max(0, Math.floor((target - Date.now()) / 1000));
  const d = Math.floor(s / 86400); s -= d * 86400;
  const h = Math.floor(s / 3600); s -= h * 3600;
  const m = Math.floor(s / 60); s -= m * 60;
  [["cd-d", String(d)], ["cd-h", String(h).padStart(2, "0")], ["cd-m", String(m).padStart(2, "0")], ["cd-s", String(s).padStart(2, "0")]].forEach(([id, v]) => {
    const el = document.getElementById(id);
    if (el.textContent !== v) { el.textContent = v; el.classList.remove("flip"); void el.offsetWidth; el.classList.add("flip"); }
  });
}
tick(); setInterval(tick, 1000);

/* ---------- carousel ---------- */
(() => {
  const track = document.getElementById("track");
  const cards = [...track.children];
  const dots = [...document.querySelectorAll("#dots button")];
  let idx = 0;
  const go = i => { i = Math.max(0, Math.min(cards.length - 1, i)); track.scrollTo({ left: cards[i].offsetLeft - (track.clientWidth - cards[i].clientWidth) / 2, behavior: "smooth" }); };
  const mark = () => {
    const mid = track.scrollLeft + track.clientWidth / 2;
    let best = 0, dist = Infinity;
    cards.forEach((c, i) => { const dd = Math.abs(c.offsetLeft + c.clientWidth / 2 - mid); if (dd < dist) { dist = dd; best = i; } });
    idx = best; dots.forEach((d, i) => d.setAttribute("aria-current", i === idx ? "true" : "false")); cards.forEach((c, i) => c.classList.toggle("active", i === idx));
  };
  track.addEventListener("scroll", () => requestAnimationFrame(mark), { passive: true });
  document.getElementById("prev").onclick = () => go(idx - 1);
  document.getElementById("next").onclick = () => go(idx + 1);
  dots.forEach(d => d.onclick = () => go(+d.dataset.i));
  mark();
})();

/* ---------- music: an original tune in Raag Bhupali over a tanpura drone ---------- */
const Music = (() => {
  let ctx, master, wet, timer, playing = false, nextT = 0, step = 0, tanT = 0, tanI = 0, audio;
  const SA = 146.83;                                   // D3
  const SCALE = [1, 9/8, 5/4, 3/2, 5/3, 2, 9/4];       // Sa Re Ga Pa Dha Sa' Re'
  const TUNE = [[5,2],[4,1],[3,1],[2,2],[1,1],[2,1],[3,4],[2,1],[3,1],[4,2],[5,2],[4,1],[3,1],[2,4],
                [0,1],[1,1],[2,2],[3,1],[2,1],[1,2],[0,4],[-1,2],[3,1],[4,1],[5,3],[6,1],[5,2],[4,2],
                [3,4],[2,1],[1,1],[0,2],[-1,4]];
  const BEAT = 0.7;
  const TANPURA = [SA * 3/4, SA, SA, SA / 2];          // Pa Sa Sa Sa(low)
  function init() {
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    master = ctx.createGain(); master.gain.value = 0; master.connect(ctx.destination);
    wet = ctx.createGain(); wet.gain.value = 0.35;
    const delay = ctx.createDelay(); delay.delayTime.value = 0.36;
    const fb = ctx.createGain(); fb.gain.value = 0.32;
    const lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 2200;
    wet.connect(delay); delay.connect(lp); lp.connect(fb); fb.connect(delay); lp.connect(master);
  }
  function bell(f, t, dur) {
    [[1, .09], [2, .022], [3, .007]].forEach(([h, g]) => {
      const o = ctx.createOscillator(), e = ctx.createGain();
      o.type = "sine"; o.frequency.value = f * h;
      e.gain.setValueAtTime(0.0001, t); e.gain.exponentialRampToValueAtTime(g, t + 0.015); e.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(e); e.connect(master); e.connect(wet); o.start(t); o.stop(t + dur + 0.05);
    });
  }
  function pluck(f, t) {
    const lp = ctx.createBiquadFilter(), e = ctx.createGain();
    lp.type = "lowpass"; lp.frequency.setValueAtTime(1800, t); lp.frequency.exponentialRampToValueAtTime(380, t + 2.6);
    e.gain.setValueAtTime(0.0001, t); e.gain.exponentialRampToValueAtTime(0.03, t + 0.03); e.gain.exponentialRampToValueAtTime(0.0001, t + 3.4);
    [1, 1.003].forEach(d => { const o = ctx.createOscillator(); o.type = "sawtooth"; o.frequency.value = f * d; o.connect(lp); o.start(t); o.stop(t + 3.5); });
    lp.connect(e); e.connect(master); e.connect(wet);
  }
  function schedule() {
    const ahead = ctx.currentTime + 0.6;
    while (nextT < ahead) { const [deg, b] = TUNE[step % TUNE.length]; if (deg >= 0) bell(SA * 2 * SCALE[deg], nextT, b * BEAT * 1.8 + 0.4); nextT += b * BEAT; step++; }
    while (tanT < ahead) { pluck(TANPURA[tanI % 4], tanT); tanT += 0.95; tanI++; }
  }
  async function play() {
    if (CONFIG.musicSrc) {
      audio ||= Object.assign(new Audio(CONFIG.musicSrc), { loop: true, volume: 0.8 });
      try { await audio.play(); playing = true; } catch (e) { playing = false; }
      return playing;
    }
    try {
      if (!ctx) init();
      await ctx.resume();
      const t = ctx.currentTime; nextT = t + 0.4; tanT = t + 0.1;
      master.gain.cancelScheduledValues(t); master.gain.setValueAtTime(master.gain.value, t); master.gain.linearRampToValueAtTime(0.8, t + 2);
      clearInterval(timer); timer = setInterval(schedule, 120); schedule();
      playing = true;
    } catch (e) { playing = false; }
    return playing;
  }
  function pause() {
    playing = false;
    if (audio) { audio.pause(); return; }
    if (!ctx) return;
    clearInterval(timer);
    const t = ctx.currentTime; master.gain.cancelScheduledValues(t); master.gain.setValueAtTime(master.gain.value, t); master.gain.linearRampToValueAtTime(0, t + 0.4);
    setTimeout(() => { if (!playing) ctx.suspend(); }, 500);
  }
  return { play, pause, get playing() { return playing; } };
})();
const musicBtn = document.getElementById("music");
function syncMusicBtn() {
  musicBtn.classList.toggle("playing", Music.playing);
  musicBtn.setAttribute("aria-pressed", String(Music.playing));
  musicBtn.setAttribute("aria-label", Music.playing ? "Pause background music" : "Play background music");
}
musicBtn.onclick = async () => { Music.playing ? Music.pause() : await Music.play(); syncMusicBtn(); };

/* ---------- petals ---------- */
const FX = (() => {
  const cv = document.getElementById("petals"), g = cv.getContext("2d");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const size = () => { cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; };
  size(); addEventListener("resize", size);
  const ps = []; let running = false, showerUntil = 0;
  const PETALS = ["#ef7d1a", "#f7c531", "#b3321c", "#ffd86b", "#e85d2a", "#4f8a3a"];
  const GOLD = ["#ffe9a0", "#f7c531", "#ffd86b", "#ef9a1a", "#fff6d6"];
  const pick = a => a[(Math.random() * a.length) | 0];
  function petal(x, y) { ps.push({ k: "petal", x, y, vx: -0.4 + Math.random() * 0.8, vy: 0.8 + Math.random() * 1.5, g: 0, r: Math.random() * 6.28, vr: -0.05 + Math.random() * 0.1, s: 5 + Math.random() * 6, c: pick(PETALS), ph: Math.random() * 6.28, life: 1e9 }); }
  function burst(x, y, n, colors, speed, kind) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * 6.28, v = speed * (0.4 + Math.random() * 0.8);
      ps.push({ k: kind, x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - speed * 0.3, g: 0.12, r: Math.random() * 6.28, vr: -0.2 + Math.random() * 0.4,
        s: kind === "spark" ? 1.5 + Math.random() * 2.5 : 4 + Math.random() * 4, c: pick(colors), ph: 0, life: 60 + Math.random() * 50 });
    }
    start();
  }
  function frame(now) {
    if (now < showerUntil && Math.random() < 0.45) petal(Math.random() * innerWidth, -20);
    g.setTransform(dpr, 0, 0, dpr, 0, 0); g.clearRect(0, 0, innerWidth, innerHeight);
    for (const p of ps) {
      p.life--; p.vy += p.g; if (p.k !== "petal") { p.vx *= 0.97; p.vy *= 0.985; }
      p.ph += 0.03; p.x += p.vx + (p.k === "petal" ? Math.sin(p.ph) * 0.6 : 0); p.y += p.vy; p.r += p.vr;
      g.save(); g.translate(p.x, p.y); g.rotate(p.r);
      if (p.k === "spark") {
        g.globalAlpha = Math.max(0, Math.min(1, p.life / 40)); g.fillStyle = p.c; g.shadowColor = "#ffe9a8"; g.shadowBlur = 8;
        g.beginPath(); g.moveTo(0, -p.s * 2); g.lineTo(p.s * .5, 0); g.lineTo(0, p.s * 2); g.lineTo(-p.s * .5, 0); g.closePath(); g.fill();
      } else {
        g.globalAlpha = p.k === "petal" ? 0.9 : Math.max(0, Math.min(0.9, p.life / 40)); g.fillStyle = p.c;
        g.beginPath(); g.ellipse(0, 0, p.s, p.s * 0.55, 0, 0, Math.PI * 2); g.fill();
      }
      g.restore();
    }
    for (let i = ps.length - 1; i >= 0; i--) if (ps[i].y > innerHeight + 30 || ps[i].life <= 0) ps.splice(i, 1);
    if (ps.length || now < showerUntil) requestAnimationFrame(frame); else { running = false; g.clearRect(0, 0, innerWidth, innerHeight); }
  }
  function start() { if (!running) { running = true; requestAnimationFrame(frame); } }
  return {
    shower(ms) { if (reduce) return; showerUntil = performance.now() + ms; start(); },
    sparks(x, y) { if (!reduce) burst(x, y, 70, GOLD, 9, "spark"); },
    tap(x, y) { if (!reduce) burst(x, y, 14, PETALS, 5, "bit"); }
  };
})();

/* ---------- gate ambience: rising gold dust ---------- */
(() => {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const box = document.getElementById("dust");
  for (let i = 0; i < 26; i++) {
    const d = document.createElement("span");
    d.className = "dust";
    d.style.left = (Math.random() * 100) + "%";
    d.style.animationDuration = (7 + Math.random() * 8) + "s";
    d.style.animationDelay = (-Math.random() * 12) + "s";
    d.style.setProperty("--drift", ((Math.random() - 0.5) * 120) + "px");
    const sz = 2 + Math.random() * 3; d.style.width = d.style.height = sz + "px";
    box.appendChild(d);
  }
})();

/* ---------- scroll reveals ---------- */
function startReveals() {
  const els = [...document.querySelectorAll("#app .reveal")];
  if (!("IntersectionObserver" in window)) { els.forEach(e => e.classList.add("in")); return; }
  const io = new IntersectionObserver(entries => entries.forEach(en => { if (en.isIntersecting) { en.target.classList.add("in"); io.unobserve(en.target); } }), { threshold: 0.15, rootMargin: "0px 0px -6% 0px" });
  els.forEach((e, i) => { if (!e.style.getPropertyValue("--d")) e.style.setProperty("--d", (Math.min(i, 8) * 0.08) + "s"); io.observe(e); });
  // later sections stagger from 0 again
  setTimeout(() => els.forEach(e => { if (!e.classList.contains("in")) e.style.setProperty("--d", "0s"); }), 2500);
}
document.documentElement.classList.add("js-anim");

/* ---------- tap anywhere for a little burst of petals ---------- */
document.getElementById("app").addEventListener("pointerdown", e => { if (!e.target.closest("a,button")) FX.tap(e.clientX, e.clientY); });

/* ---------- open the envelope ---------- */
document.getElementById("seal").addEventListener("click", async (ev) => {
  const gate = document.getElementById("gate"), env = document.getElementById("env"), seal = ev.currentTarget;
  if (env.classList.contains("open")) return;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const at = (ms, fn) => setTimeout(fn, reduce ? Math.min(ms, 300) : ms);
  if (!Music.playing) { Music.play().then(syncMusicBtn); }
  const reveal = (exitMs) => {
    window.scrollTo(0, 0);
    document.documentElement.classList.remove("locked");
    gate.classList.add("exit");
    document.getElementById("app").removeAttribute("aria-hidden");
    FX.shower(3000);
    at(300, startReveals);
    at(exitMs, () => gate.classList.add("gone"));
  };
  const r = seal.getBoundingClientRect();
  FX.sparks(r.left + r.width / 2, r.top + r.height / 2);
  env.classList.add("open");
  document.getElementById("hint").textContent = "You are cordially invited";
  at(6400, () => { env.classList.add("away"); reveal(1400); });
});

document.getElementById("app").setAttribute("aria-hidden", "true");
document.getElementById("seal").focus({ preventScroll: true });
</script>
</body>
